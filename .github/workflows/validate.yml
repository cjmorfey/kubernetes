name: Validate cluster automation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: sudo apt-get update && sudo apt-get install -y ansible shellcheck
      - name: Check RKE2 playbooks and configuration
        run: ./scripts/check.sh
