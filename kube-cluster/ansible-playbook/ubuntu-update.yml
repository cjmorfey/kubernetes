---
- name: Update Ubuntu hosts one at a time
  hosts: k8s
  become: true
  serial: 1
  tasks:
    - name: Update Ubuntu packages while respecting Kubernetes holds
      ansible.builtin.apt:
        update_cache: true
        upgrade: safe

    - name: Check Ubuntu reboot marker
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: ubuntu_reboot

    - name: Report required maintenance
      ansible.builtin.debug:
        msg: 'Reboot required. Drain this node before rebooting an active cluster.'
      when: ubuntu_reboot.stat.exists
