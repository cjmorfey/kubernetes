---
- name: Generate a short-lived worker join command
  hosts: master
  become: true
  tasks:
    - name: Create join token in memory
      ansible.builtin.command: kubeadm token create --ttl 15m --print-join-command
      register: worker_join
      no_log: true
      changed_when: true

- name: Join workers without resetting existing nodes
  hosts: workers
  become: true
  tasks:
    - name: Join worker once
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['master'][0]].worker_join.stdout }} --cri-socket=unix:///run/containerd/containerd.sock"
        creates: /etc/kubernetes/kubelet.conf
      no_log: true
