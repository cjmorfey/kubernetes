---
- name: Export private administrator access to the controller
  hosts: master[0]
  become: true
  gather_facts: false
  tasks:
    - name: Create private local output directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.local"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Fetch administrator kubeconfig
      ansible.builtin.fetch:
        src: "{{ rke2_kubeconfig }}"
        dest: "{{ playbook_dir }}/../../.local/kubeconfig"
        flat: true
      no_log: true

    - name: Replace local-only API URL with the registration endpoint
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/../../.local/kubeconfig"
        regexp: 'https://127\.0\.0\.1:6443'
        replace: "https://{{ rke2_registration_address }}:6443"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Restrict local kubeconfig permissions
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.local/kubeconfig"
        mode: '0600'
      delegate_to: localhost
      become: false
