---
- name: Export private administrator access to the controller
  hosts: master
  become: true
  gather_facts: false
  tasks:
    - name: Create private local output directory
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.local"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

    - name: Fetch administrator kubeconfig
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "{{ playbook_dir }}/../../.local/kubeconfig"
        flat: true
      no_log: true

    - name: Restrict local kubeconfig permissions
      ansible.builtin.file:
        path: "{{ playbook_dir }}/../../.local/kubeconfig"
        mode: '0600'
      delegate_to: localhost
      become: false
