---
- name: Take an on-demand etcd snapshot
  hosts: master[0]
  become: true
  gather_facts: false
  tasks:
    - name: Create snapshot using configured local and optional S3 storage
      ansible.builtin.command: "{{ rke2_binary }} etcd-snapshot save"
      changed_when: true

    - name: List available snapshots
      ansible.builtin.command: "{{ rke2_binary }} etcd-snapshot ls"
      register: snapshots
      changed_when: false

    - name: Print snapshot locations
      ansible.builtin.debug:
        msg: "{{ snapshots.stdout_lines }}"
