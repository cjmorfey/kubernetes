---
- import_playbook: bootstrap.yml
- import_playbook: preflight.yml

- name: Prepare Ubuntu Kubernetes nodes
  hosts: k8s
  any_errors_fatal: true
  become: true
  tasks:
    - name: Install prerequisites and Ubuntu containerd
      ansible.builtin.apt:
        name: [ca-certificates, curl, gpg, containerd, conntrack, socat, iptables, python3-apt]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Disable active swap
      ansible.builtin.command: swapoff -a
      when: ansible_facts.swaptotal_mb | int > 0

    - name: Disable swap mounts after reboot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(\s*[^#\s]+\s+\S+\s+swap\s+.*)$'
        replace: '# Disabled for Kubernetes: \1'

    - name: Persist kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/kubernetes.conf
        mode: '0644'
        content: |
          overlay
          br_netfilter

    - name: Load kernel modules
      ansible.builtin.command: "modprobe {{ item }}"
      loop: [overlay, br_netfilter]
      changed_when: false

    - name: Persist Kubernetes networking settings
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        mode: '0644'
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Apply networking settings
      ansible.builtin.command: sysctl --system
      changed_when: false

    - name: Create containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'

    - name: Read default containerd configuration
      ansible.builtin.command: containerd config default
      register: containerd_defaults
      changed_when: false

    - name: Configure containerd CRI with systemd cgroups
      ansible.builtin.copy:
        dest: /etc/containerd/config.toml
        mode: '0644'
        content: "{{ containerd_defaults.stdout | replace('SystemdCgroup = false', 'SystemdCgroup = true') }}\n"
      notify: Restart containerd

    - name: Apply runtime configuration before kubeadm
      ansible.builtin.meta: flush_handlers

    - name: Enable containerd
      ansible.builtin.systemd:
        name: containerd
        state: started
        enabled: true

    - name: Create APT key directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes repository key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes.asc
        mode: '0644'

    - name: Configure versioned Kubernetes repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor_version }}/deb/ /"
        filename: kubernetes
        state: present

    - name: Read installed master package version
      ansible.builtin.command:
        argv: [dpkg-query, -W, '-f=${db:Status-Status} ${Version}', kubeadm]
        expand_argument_vars: false
      delegate_to: "{{ groups['master'][0] }}"
      run_once: true
      register: master_package
      changed_when: false
      failed_when: false

    - name: List available versions in the selected minor repository
      ansible.builtin.command: apt-cache madison kubeadm
      delegate_to: "{{ groups['master'][0] }}"
      run_once: true
      register: available_kubeadm
      changed_when: false

    - name: Require a resolvable package version
      ansible.builtin.assert:
        that: kubernetes_package_version | length > 0 or master_package.stdout.startswith('installed ') or available_kubeadm.stdout_lines | length > 0
        fail_msg: No kubeadm package found. Check the selected minor repository and node internet access.

    - name: Select one exact version for every node, reusing the master on reruns
      ansible.builtin.set_fact:
        selected_package_version: "{{ kubernetes_package_version if kubernetes_package_version | length > 0 else (master_package.stdout.split()[1] if master_package.stdout.startswith('installed ') else available_kubeadm.stdout_lines[0].split('|')[1] | trim) }}"

    - name: Check that selected packages belong to the configured minor
      ansible.builtin.assert:
        that: selected_package_version.startswith(kubernetes_minor_version[1:] + '.')
        fail_msg: Installed master and configured minor differ. Use a separate kubeadm upgrade procedure.

    - name: Inspect already installed packages
      ansible.builtin.package_facts:
        manager: apt

    - name: Prevent implicit upgrades or downgrades of existing nodes
      ansible.builtin.assert:
        that: ansible_facts.packages[item][0].version == selected_package_version
        fail_msg: 'Existing {{ item }} differs from {{ selected_package_version }}. Upgrade nodes explicitly before rerunning setup.'
      loop: [kubelet, kubeadm, kubectl]
      when: item in ansible_facts.packages

    - name: Install the same Kubernetes package version on every node
      ansible.builtin.apt:
        name:
          - "kubelet={{ selected_package_version }}"
          - "kubeadm={{ selected_package_version }}"
          - "kubectl={{ selected_package_version }}"
        state: present

    - name: Pin kubelet to the existing LAN address
      ansible.builtin.copy:
        dest: /etc/default/kubelet
        mode: '0644'
        content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
      notify: Restart kubelet

    - name: Hold Kubernetes components against unattended upgrades
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: [kubelet, kubeadm, kubectl]

    - name: Enable kubelet
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted
    - name: Restart kubelet
      ansible.builtin.systemd:
        name: kubelet
        state: restarted
